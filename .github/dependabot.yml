version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      dynatrace:
        patterns:
          - "@dynatrace/*"
          - "@dynatrace-sdk/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
